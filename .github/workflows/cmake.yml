name: "cmake"
on:
  pull_request:
  push:

jobs:
  msvc:
    runs-on: 'windows-latest'
    steps:
      - uses: actions/checkout@v6
      - name: 'Configure cmake'
        run: |
          cmake -DCMAKE_SYSTEM_VERSION=10.0.19041.0 -DONI_BINK_VIDEO=ON `
            -S . -B build -A Win32
      - name: 'Build'
        run: |
          cmake --build build --parallel
  mingw-linux:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v6
      - name: 'Install MinGW'
        run: |
          sudo apt-get install gcc-mingw-w64-i686 g++-mingw-w64-i686
      - name: 'Configure cmake'
        run: |
          cmake -S . -B build -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc-win32 \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++-win32 \
            -DONI_BINK_VIDEO=ON
      - name: 'Build'
        run: |
          cmake --build build --parallel
  sdl-linux-x86_64:
    # native 64-bit SDL/OpenGL/OpenAL build (compiles and links; game data loading is 32-bit only for now)
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v6
      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libopenal-dev libavcodec-dev libavutil-dev libgl-dev clang
      - name: 'Configure cmake'
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release
      - name: 'Build'
        run: |
          cmake --build build --parallel
  sdl-macos-arm64:
    # Apple Silicon (arm64) build through the SDL platform layer
    runs-on: 'macos-latest'
    steps:
      - uses: actions/checkout@v6
      - name: 'Install dependencies'
        run: |
          brew install sdl2 openal-soft ffmpeg pkg-config
      - name: 'Configure cmake'
        run: |
          cmake -S . -B build -DPlatform_SDL=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix openal-soft)"
      - name: 'Build'
        run: |
          cmake --build build --parallel
      - name: 'Show binary architecture'
        run: |
          file build/bin/Oni
          lipo -info build/bin/Oni
